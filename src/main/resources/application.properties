server.port=${PORT:8080}
spring.application.name=dimdim-webapp

# Configuração de Banco de Dados (Azure SQL Database ou H2 Local)
# Quando as variáveis de ambiente do Azure SQL são fornecidas, elas assumem prioridade absoluta.
spring.datasource.url=${AZURE_SQL_URL:jdbc:h2:mem:dimdimdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AZURE_SQL_USERNAME:sa}
spring.datasource.password=${AZURE_SQL_PASSWORD:}
spring.datasource.driver-class-name=${AZURE_SQL_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Suporte ao H2 Console apenas se estiver em modo H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Actuator / Health Probe
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.br.com.fiap.dimdim=INFO
logging.level.org.hibernate.SQL=WARN
