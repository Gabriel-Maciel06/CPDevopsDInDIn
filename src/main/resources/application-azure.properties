# Perfil para execução em nuvem no Azure App Service com Azure SQL Database
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# O schema oficial é criado por scripts/ddl_tables.sql; o update só atua se a tabela não existir.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Strings como NVARCHAR/N'...': sem isso emojis e caracteres fora do Latin1 viram '?' no SQL Server
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.h2.console.enabled=false

# Health do Actuator sem detalhes (não expor versão/host do banco publicamente)
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# HikariCP Pool dimensionado para Azure SQL Basic (5 DTU) + App Service B1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
