<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <linearGradient id="appsvc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3CCBF4"/><stop offset="1" stop-color="#0078D4"/></linearGradient>
    <linearGradient id="sql" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#50E6FF"/><stop offset="1" stop-color="#005BA1"/></linearGradient>
    <linearGradient id="appi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B796F9"/><stop offset="1" stop-color="#773ADC"/></linearGradient>
    <linearGradient id="law" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BD7F7"/><stop offset="1" stop-color="#2B88D8"/></linearGradient>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0F172A">DimDim – Arquitetura da Solução PaaS na Microsoft Azure</text>
  <text x="40" y="70" font-size="14" fill="#475569">Web App (Java 21 / Spring Boot) + Azure SQL Database + Application Insights · Região: Canada Central</text>

  <!-- Usuários -->
  <g transform="translate(40,250)">
    <rect width="190" height="150" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="95" cy="48" r="20" fill="#64748B"/>
    <path d="M55,100 q40,-45 80,0 z" fill="#64748B"/>
    <text x="95" y="126" font-size="14" font-weight="600" text-anchor="middle" fill="#0F172A">Steve Jobs / DimDim</text>
    <text x="95" y="143" font-size="12" text-anchor="middle" fill="#475569">Navegador · Swagger</text>
  </g>

  <!-- Desenvolvedor -->
  <g transform="translate(40,460)">
    <rect width="190" height="130" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect x="60" y="22" width="70" height="44" rx="4" fill="#1E293B"/>
    <text x="95" y="50" font-size="13" text-anchor="middle" fill="#22D3EE" font-family="Menlo, monospace">&gt;_ az</text>
    <text x="95" y="92" font-size="14" font-weight="600" text-anchor="middle" fill="#0F172A">Equipe DevOps</text>
    <text x="95" y="110" font-size="12" text-anchor="middle" fill="#475569">Azure CLI · deploy_azure.sh</text>
  </g>

  <!-- Assinatura / Resource Group -->
  <rect x="300" y="100" width="860" height="510" rx="14" fill="#F0F7FF" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="320" y="128" font-size="15" font-weight="700" fill="#0078D4">Assinatura Azure for Students</text>
  <rect x="320" y="142" width="820" height="450" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 4"/>
  <text x="338" y="168" font-size="13" font-weight="600" fill="#334155">Resource Group: rg-dimdim-webapp</text>

  <!-- App Service Plan + Web App -->
  <rect x="350" y="190" width="330" height="240" rx="12" fill="#F8FAFC" stroke="#0078D4"/>
  <text x="366" y="214" font-size="12" fill="#475569">App Service Plan Linux B1 · plan-dimdim-rm562795</text>
  <g transform="translate(372,232)">
    <rect width="286" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="16" y="18" width="54" height="54" rx="10" fill="url(#appsvc)"/>
    <path d="M28,36 h30 M28,46 h30 M28,56 h20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="84" y="40" font-size="15" font-weight="700" fill="#0F172A">Azure App Service</text>
    <text x="84" y="60" font-size="12" fill="#475569">app-dimdim-rm562795</text>
    <text x="16" y="100" font-size="12" fill="#0F172A">• Front-end HTML/CSS/JS</text>
    <text x="16" y="120" font-size="12" fill="#0F172A">• Spring Boot 3.3 · Java 21 · REST API</text>
    <text x="16" y="140" font-size="12" fill="#0F172A">• Agente Java do App Insights (~3)</text>
    <text x="16" y="160" font-size="12" fill="#0F172A">• App Settings: credenciais do banco</text>
  </g>

  <!-- Azure SQL -->
  <g transform="translate(790,190)">
    <rect width="320" height="240" rx="12" fill="#F8FAFC" stroke="#005BA1"/>
    <text x="16" y="24" font-size="12" fill="#475569">Azure SQL Server · sql-dimdim-rm562795</text>
    <g transform="translate(22,42)">
      <rect width="276" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <ellipse cx="43" cy="26" rx="26" ry="9" fill="#50E6FF"/>
      <path d="M17,26 v38 a26,9 0 0 0 52,0 v-38" fill="url(#sql)"/>
      <text x="84" y="36" font-size="15" font-weight="700" fill="#0F172A">Azure SQL Database</text>
      <text x="84" y="56" font-size="12" fill="#475569">sqldb-dimdim · Basic (PaaS)</text>
      <text x="16" y="100" font-size="12" fill="#0F172A">• tb_dimdim_categoria (1)</text>
      <text x="16" y="120" font-size="12" fill="#0F172A">• tb_dimdim_transacao (N) · FK</text>
      <text x="16" y="140" font-size="12" fill="#0F172A">• Firewall: serviços Azure + IP do dev</text>
      <text x="16" y="160" font-size="12" fill="#0F172A">• TLS obrigatório (encrypt=true)</text>
    </g>
  </g>

  <!-- Application Insights -->
  <g transform="translate(372,462)">
    <rect width="286" height="110" rx="10" fill="#FFFFFF" stroke="#773ADC"/>
    <rect x="16" y="18" width="50" height="50" rx="25" fill="url(#appi)"/>
    <path d="M30,52 l8,-12 l7,8 l9,-16" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="38" font-size="15" font-weight="700" fill="#0F172A">Application Insights</text>
    <text x="80" y="58" font-size="12" fill="#475569">appi-dimdim-rm562795</text>
    <text x="16" y="94" font-size="12" fill="#0F172A">Requests · Dependências SQL · Live Metrics</text>
  </g>

  <!-- Log Analytics -->
  <g transform="translate(812,462)">
    <rect width="276" height="110" rx="10" fill="#FFFFFF" stroke="#2B88D8"/>
    <rect x="16" y="18" width="50" height="50" rx="8" fill="url(#law)"/>
    <path d="M28,56 v-10 M38,56 v-20 M48,56 v-14 M58,56 v-24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="38" font-size="15" font-weight="700" fill="#0F172A">Log Analytics</text>
    <text x="80" y="58" font-size="12" fill="#475569">law-dimdim-rm562795</text>
    <text x="16" y="94" font-size="12" fill="#0F172A">Armazenamento de telemetria · KQL</text>
  </g>

  <!-- Conexões -->
  <line x1="230" y1="325" x2="368" y2="325" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="240" y="315" font-size="12" font-weight="600" fill="#334155">HTTPS 443</text>

  <path d="M230,525 C300,525 300,420 368,400" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="135" y="612" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">az webapp deploy (JAR) + DDL</text>


  <line x1="660" y1="322" x2="810" y2="322" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="672" y="312" font-size="12" font-weight="600" fill="#334155">JDBC TLS 1433</text>
  <text x="672" y="342" font-size="11" fill="#475569">HikariCP (pool 10)</text>

  <line x1="515" y1="414" x2="515" y2="460" stroke="#773ADC" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="524" y="444" font-size="11" font-weight="600" fill="#773ADC">telemetria</text>

  <line x1="658" y1="517" x2="810" y2="517" stroke="#2B88D8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="680" y="507" font-size="11" font-weight="600" fill="#2B88D8">workspace-based</text>
</svg>
